<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MadLease is a map of subleases around the UW–Madison campus, posted by students with a wisc.edu email."
    />
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MadLease</title>
    <!-- Sets the theme before anything is drawn. Waiting for React to do this
         would show the light page for a moment on every reload in dark mode. -->
    <script>
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('madlease-theme')
        } catch (e) {
          // Storage can be blocked (private windows). Fall through to the system setting.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.getElementById('site-favicon').href = '%BASE_URL%brand/favicon-' + theme + '.svg'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
